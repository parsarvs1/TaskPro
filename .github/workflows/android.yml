name: Build TaskPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Get source code
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # -----------------------------
      # Java 21
      # Capacitor Android requires Java 21
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # -----------------------------
      # Prepare package.json
      # -----------------------------
      - name: Prepare package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi


      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund


      # -----------------------------
      # Prepare web files
      # -----------------------------
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi


      # -----------------------------
      # Capacitor configuration
      # -----------------------------
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF


      # -----------------------------
      # Add Android platform
      # -----------------------------
      - name: Add Android
        run: |
          npx cap add android


      # -----------------------------
      # Sync web project with Android
      # -----------------------------
      - name: Capacitor Sync
        run: |
          npx cap sync android


      # -----------------------------
      # Show Java version
      # -----------------------------
      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"


      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
