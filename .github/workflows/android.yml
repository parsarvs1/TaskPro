name: Build TaskPro APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:

  build:

    name: Build TaskPro Android APK

    runs-on: ubuntu-latest


    steps:


      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # NODE
      # ========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22


      # ========================================
      # JAVA
      # ========================================

      - name: Setup Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: 21


      # ========================================
      # CHECK VERSIONS
      # ========================================

      - name: Check environment
        run: |

          java -version

          node --version

          npm --version


      # ========================================
      # INSTALL
      # ========================================

      - name: Install dependencies
        run: |

          npm install \
            --no-audit \
            --no-fund


      # ========================================
      # PREPARE WWW
      # ========================================

      - name: Prepare web files
        run: |

          rm -rf www

          mkdir -p www


          cp index.html www/

          cp app.js www/

          cp style.css www/

          cp icon.png www/


          if [ -f manifest.json ]; then

            cp manifest.json www/

          fi


          if [ -f sw.js ]; then

            cp sw.js www/

          fi


      # ========================================
      # CAPACITOR CONFIG
      # ========================================

      - name: Create Capacitor config
        run: |

          cat > capacitor.config.json <<'EOF'

          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www"
          }

          EOF


      # ========================================
      # ADD ANDROID
      # ========================================

      - name: Add Android
        run: |

          rm -rf android

          npx cap add android


      # ========================================
      # INSTALL IMAGEMAGICK
      # ========================================

      - name: Install ImageMagick
        run: |

          sudo apt-get update -y

          sudo apt-get install -y imagemagick


      # ========================================
      # ANDROID ICON
      # ========================================

      - name: Generate Android launcher icons
        run: |

          RES="android/app/src/main/res"


          mkdir -p "$RES/mipmap-mdpi"

          mkdir -p "$RES/mipmap-hdpi"

          mkdir -p "$RES/mipmap-xhdpi"

          mkdir -p "$RES/mipmap-xxhdpi"

          mkdir -p "$RES/mipmap-xxxhdpi"


          convert icon.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"


          convert icon.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"


          convert icon.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"


          convert icon.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"


          convert icon.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"


          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"


          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"


          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"


          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          echo "================================"

          echo "TaskPro icons created"

          echo "================================"


      # ========================================
      # FIX MANIFEST
      # ========================================

      - name: Configure Android manifest
        run: |

          python3 <<'PY'

          from pathlib import Path


          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )


          text = path.read_text()


          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )


          if "android:roundIcon=" not in text:

              text = text.replace(

                  'android:icon="@mipmap/ic_launcher"',

                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',

                  1

              )


          path.write_text(text)

          PY


      # ========================================
      # SYNC
      # ========================================

      - name: Capacitor sync
        run: |

          npx cap sync android


      # ========================================
      # KOTLIN FIX
      # ========================================

      - name: Fix Kotlin dependencies
        run: |

          cat >> android/build.gradle <<'EOF'


          allprojects {

              configurations.configureEach {

                  exclude group:
                      "org.jetbrains.kotlin",
                      module:
                      "kotlin-stdlib-jdk7"


                  exclude group:
                      "org.jetbrains.kotlin",
                      module:
                      "kotlin-stdlib-jdk8"


                  resolutionStrategy {

                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      )

                  }

              }

          }

          EOF


      # ========================================
      # GRADLE PROPERTIES
      # ========================================

      - name: Configure Gradle
        run: |

          cat > android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          org.gradle.daemon=false

          org.gradle.parallel=false

          org.gradle.workers.max=2

          android.useAndroidX=true

          EOF


      # ========================================
      # BUILD
      # ========================================

      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew


          ./gradlew clean \
            --no-daemon


          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2


      # ========================================
      # CHECK APK
      # ========================================

      - name: Check APK
        run: |

          echo "APK files:"


          find android/app/build \
            -name "*.apk" \
            -type f \
            -exec ls -lh {} \;


      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: TaskPro-APK

          path:
            android/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
