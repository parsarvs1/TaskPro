name: Build TaskPro APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build TaskPro Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # 3. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ==========================================
      # 4. Check versions
      # ==========================================
      - name: Check versions
        run: |
          echo "========== JAVA =========="
          java -version

          echo ""
          echo "========== NODE =========="
          node --version

          echo ""
          echo "========== NPM =========="
          npm --version


      # ==========================================
      # 5. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          npm install \
            --no-audit \
            --no-fund \
            --prefer-offline \
            --fetch-retries=5 \
            --fetch-retry-factor=2 \
            --fetch-retry-mintimeout=10000 \
            --fetch-retry-maxtimeout=120000


      # ==========================================
      # 6. Prepare WWW
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp manifest.json www/
          cp sw.js www/

          echo "========== WWW =========="
          ls -lah www


      # ==========================================
      # 7. Check icon
      # ==========================================
      - name: Check icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          echo "========== ICON =========="
          file icon.png
          ls -lh icon.png


      # ==========================================
      # 8. Create Capacitor config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.parsa.taskpro",
            "appName": "TaskPro",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json


      # ==========================================
      # 9. Prepare Android
      # ==========================================
      - name: Prepare Android
        run: |
          rm -rf android

          npx cap add android


      # ==========================================
      # 10. Install ImageMagick
      # ==========================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ==========================================
      # 11. Generate Android icons manually
      # ==========================================
      - name: Generate Android icons
        run: |
          set -e

          echo "========== Preparing icons =========="

          ICON="icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          # Remove old launcher resources
          rm -rf android/app/src/main/res/mipmap-ldpi
          rm -rf android/app/src/main/res/mipmap-mdpi
          rm -rf android/app/src/main/res/mipmap-hdpi
          rm -rf android/app/src/main/res/mipmap-xhdpi
          rm -rf android/app/src/main/res/mipmap-xxhdpi
          rm -rf android/app/src/main/res/mipmap-xxxhdpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Create folders
          mkdir -p android/app/src/main/res/mipmap-ldpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Android launcher icon sizes
          convert "$ICON" -resize 36x36 \
            android/app/src/main/res/mipmap-ldpi/ic_launcher.png

          convert "$ICON" -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON" -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON" -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON" -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON" -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Round launcher icons
          cp android/app/src/main/res/mipmap-ldpi/ic_launcher.png \
            android/app/src/main/res/mipmap-ldpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo ""
          echo "========== Generated icons =========="

          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" \) \
            | sort


      # ==========================================
      # 12. Fix Android Manifest
      # ==========================================
      - name: Configure Android launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@mipmap/ic_launcher_round"'
          )

          manifest.write_text(text)

          print(manifest.read_text())
          PY


      # ==========================================
      # 13. Gradle properties
      # ==========================================
      - name: Configure Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF


      # ==========================================
      # 14. Fix Kotlin duplicate classes
      # ==========================================
      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          EOF


      # ==========================================
      # 15. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ==========================================
      # 16. Verify project
      # ==========================================
      - name: Verify Android project
        run: |
          echo "========== ANDROID =========="
          ls -lah android

          echo ""
          echo "========== GRADLE =========="
          ls -lah android/gradle

          echo ""
          echo "========== ICONS =========="

          find android/app/src/main/res \
            -type f \
            -name "ic_launcher*" \
            | sort


      # ==========================================
      # 17. Make Gradle executable
      # ==========================================
      - name: Make Gradle executable
        working-directory: android
        run: |
          chmod +x gradlew


      # ==========================================
      # 18. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-parallel


      # ==========================================
      # 19. Find APK
      # ==========================================
      - name: Find APK
        run: |
          echo "========== APK =========="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 20. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
