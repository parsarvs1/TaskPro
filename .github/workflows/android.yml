name: Build TaskPro APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:
  build:
    name: Build TaskPro Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. دریافت پروژه
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. نصب Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 3. نصب Java 21
      # Capacitor Android به Java 21 نیاز دارد
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # 4. بررسی Java
      # ==========================================
      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ==========================================
      # 5. ساخت package.json در صورت نبودن
      # ==========================================
      - name: Prepare package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi


      # ==========================================
      # 6. نصب Capacitor و ابزار ساخت آیکون
      # ==========================================
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets \
            --save-dev \
            --no-audit \
            --no-fund


      # ==========================================
      # 7. ساخت پوشه www
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi


      # ==========================================
      # 8. بررسی فایل‌های پروژه
      # ==========================================
      - name: Check project files
        run: |
          echo "========== Project =========="
          ls -la

          echo ""
          echo "========== WWW =========="
          ls -la www

          echo ""
          echo "========== Icon =========="

          if [ -f icon.png ]; then
            echo "icon.png found successfully"
            file icon.png
          else
            echo "ERROR: icon.png was not found!"
            exit 1
          fi


      # ==========================================
      # 9. ساخت Capacitor Config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # 10. اضافه کردن Android
      # ==========================================
      - name: Add Android platform
        run: |
          npx cap add android


      # ==========================================
      # 11. آماده‌سازی آیکون
      # ==========================================
      - name: Prepare app icon
        run: |
          rm -rf resources
          mkdir -p resources

          cp icon.png resources/icon.png

          echo "Icon copied successfully:"
          file resources/icon.png


      # ==========================================
      # 12. ساخت آیکون‌های Android
      # ==========================================
      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android


      # ==========================================
      # 13. Sync Capacitor
      # ==========================================
      - name: Capacitor Sync
        run: |
          npx cap sync android


      # ==========================================
      # 14. بررسی Android Resources
      # ==========================================
      - name: Check Android icons
        run: |
          echo "========== Android icon files =========="

          find android/app/src/main/res \
            -type f \
            \( -name "*ic_launcher*" -o -name "*ic_launcher_foreground*" \) \
            -print


      # ==========================================
      # 15. ساخت APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 16. بررسی APK
      # ==========================================
      - name: Check APK
        run: |
          echo "========== APK =========="

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # 17. آپلود APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
