name: Build TaskPro APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TaskPro Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 3. Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # 4. Check environment
      # ==========================================
      - name: Check environment
        run: |
          java -version
          node --version
          npm --version


      # ==========================================
      # 5. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --save-dev \
            --no-audit \
            --no-fund


      # ==========================================
      # 6. Prepare WWW
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi


      # ==========================================
      # 7. Check icon
      # ==========================================
      - name: Check icon
        run: |
          if [ ! -f icon.png ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          echo "Icon:"
          file icon.png


      # ==========================================
      # 8. Capacitor config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # 9. Add Android
      # ==========================================
      - name: Add Android
        run: |
          npx cap add android


      # ==========================================
      # 10. Create Android icons
      # ==========================================
      - name: Create Android launcher icons
        run: |

          sudo apt-get update -y
          sudo apt-get install -y imagemagick

          RES="android/app/src/main/res"

          mkdir -p "$RES/mipmap-ldpi"
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo "Generating launcher icons..."

          convert icon.png -resize 36x36 \
            "$RES/mipmap-ldpi/ic_launcher.png"

          convert icon.png -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert icon.png -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert icon.png -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert icon.png -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert icon.png -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # Round icons

          convert icon.png -resize 36x36 \
            "$RES/mipmap-ldpi/ic_launcher_round.png"

          convert icon.png -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          convert icon.png -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          convert icon.png -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          convert icon.png -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          convert icon.png -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          echo "Icons generated successfully."

          find "$RES" \
            -type f \
            -name "ic_launcher*" \
            -print


      # ==========================================
      # 11. Fix Android Manifest
      # ==========================================
      - name: Configure Android launcher
        run: |

          python3 <<'PY'

          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          if 'android:roundIcon=' not in text:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher"\n'
                  '        android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          manifest.write_text(text)

          PY


      # ==========================================
      # 12. Capacitor Sync
      # ==========================================
      - name: Capacitor Sync
        run: |
          npx cap sync android


      # ==========================================
      # 13. Kotlin compatibility
      # ==========================================
      - name: Fix Kotlin dependencies
        run: |

          python3 <<'PY'

          from pathlib import Path

          gradle_file = Path("android/build.gradle")

          text = gradle_file.read_text()

          fix = r'''

          allprojects {
              configurations.configureEach {

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  }
              }
          }
          '''

          if "kotlin-stdlib-jdk7" not in text:
              text += fix

          gradle_file.write_text(text)

          PY


      # ==========================================
      # 14. Gradle configuration
      # ==========================================
      - name: Configure Gradle
        run: |

          cat > android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          org.gradle.daemon=false

          org.gradle.parallel=false

          org.gradle.workers.max=2

          android.useAndroidX=true

          EOF


      # ==========================================
      # 15. Clean
      # ==========================================
      - name: Clean Gradle
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon


      # ==========================================
      # 16. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --max-workers=2


      # ==========================================
      # 17. Check APK
      # ==========================================
      - name: Check APK
        run: |

          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK successfully created!"

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # 18. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: TaskPro-APK

          path: android/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
