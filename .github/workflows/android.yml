name: Build TaskPro APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build TaskPro Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==========================================
      # 3. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ==========================================
      # 4. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          npm install \
            --no-audit \
            --no-fund \
            --prefer-offline \
            --fetch-retries=5 \
            --fetch-retry-factor=2 \
            --fetch-retry-mintimeout=10000 \
            --fetch-retry-maxtimeout=120000


      # ==========================================
      # 5. Prepare WWW
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp manifest.json www/
          cp sw.js www/

          echo "WWW files:"
          ls -lah www


      # ==========================================
      # 6. Check icon
      # ==========================================
      - name: Check icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          file icon.png
          ls -lh icon.png


      # ==========================================
      # 7. Capacitor config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.parsa.taskpro",
            "appName": "TaskPro",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json


      # ==========================================
      # 8. Create Android
      # ==========================================
      - name: Prepare Android
        run: |
          rm -rf android
          npx cap add android


      # ==========================================
      # 9. Install ImageMagick
      # ==========================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ==========================================
      # 10. Generate Android icons
      # ==========================================
      - name: Generate Android icons
        run: |
          set -e

          ICON="icon.png"

          rm -rf android/app/src/main/res/mipmap-ldpi
          rm -rf android/app/src/main/res/mipmap-mdpi
          rm -rf android/app/src/main/res/mipmap-hdpi
          rm -rf android/app/src/main/res/mipmap-xhdpi
          rm -rf android/app/src/main/res/mipmap-xxhdpi
          rm -rf android/app/src/main/res/mipmap-xxxhdpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          mkdir -p android/app/src/main/res/mipmap-ldpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert "$ICON" -resize 36x36 \
            android/app/src/main/res/mipmap-ldpi/ic_launcher.png

          convert "$ICON" -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON" -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON" -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON" -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON" -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          for density in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            cp \
              android/app/src/main/res/mipmap-$density/ic_launcher.png \
              android/app/src/main/res/mipmap-$density/ic_launcher_round.png
          done

          echo "Icons generated successfully."


      # ==========================================
      # 11. Configure Gradle
      # ==========================================
      - name: Configure Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF


      # ==========================================
      # 12. Fix Kotlin duplicate classes
      # ==========================================
      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          EOF


      # ==========================================
      # 13. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ==========================================
      # 14. Create Release Keystore
      # ==========================================
      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/taskpro-release.jks

          echo "Keystore created:"
          ls -lh android/taskpro-release.jks


      # ==========================================
      # 15. Configure Release Signing
      # ==========================================
      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file("../taskpro-release.jks")
                      storePassword "${KEYSTORE_PASSWORD}"
                      keyAlias "${KEY_ALIAS}"
                      keyPassword "${KEY_PASSWORD}"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF


      # ==========================================
      # 16. Verify Gradle project
      # ==========================================
      - name: Verify Android project
        run: |
          echo "========== ANDROID =========="
          ls -lah android

          echo ""
          echo "========== APP =========="
          ls -lah android/app

          echo ""
          echo "========== KEYSTORE =========="
          ls -lh android/taskpro-release.jks


      # ==========================================
      # 17. Make Gradle executable
      # ==========================================
      - name: Make Gradle executable
        working-directory: android
        run: |
          chmod +x gradlew


      # ==========================================
      # 18. Build RELEASE APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --no-parallel


      # ==========================================
      # 19. Find APK
      # ==========================================
      - name: Find APK
        run: |
          echo "========== RELEASE APK =========="

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 20. Upload Release APK
      # ==========================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
