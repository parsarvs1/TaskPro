name: Build TaskPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت پروژه
      - name: Checkout
        uses: actions/checkout@v4

      # 2. نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. ساخت package.json در صورت نبودن
      - name: Prepare package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      # 4. نصب وابستگی‌ها
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 5. ساخت پوشه www
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi

      # 6. ساخت Capacitor
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      # 7. اضافه کردن Android
      - name: Add Android
        run: |
          npx cap add android

      # 8. Sync
      - name: Capacitor Sync
        run: |
          npx cap sync android

      # 9. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 10. ساخت APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 11. دریافت APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
