name: Build TaskPro APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:
  build:
    name: Build TaskPro Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 3. Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # 4. Check versions
      # ==========================================
      - name: Check environment
        run: |
          echo "========== Java =========="
          java -version

          echo ""
          echo "========== Node =========="
          node --version

          echo ""
          echo "========== NPM =========="
          npm --version


      # ==========================================
      # 5. package.json
      # ==========================================
      - name: Prepare package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi


      # ==========================================
      # 6. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets \
            --save-dev \
            --no-audit \
            --no-fund


      # ==========================================
      # 7. Prepare WWW
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi


      # ==========================================
      # 8. Check icon
      # ==========================================
      - name: Check icon
        run: |
          if [ ! -f icon.png ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          echo "Icon found:"
          file icon.png


      # ==========================================
      # 9. Capacitor Config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # 10. Add Android
      # ==========================================
      - name: Add Android
        run: |
          npx cap add android


      # ==========================================
      # 11. Prepare resources
      # ==========================================
      - name: Prepare icon resources
        run: |
          rm -rf resources
          mkdir -p resources

          cp icon.png resources/icon.png

          echo "Resource icon:"
          file resources/icon.png


      # ==========================================
      # 12. Generate Android icons
      # ==========================================
      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android


      # ==========================================
      # 13. Sync Capacitor
      # ==========================================
      - name: Capacitor Sync
        run: |
          npx cap sync android


      # ==========================================
      # 14. Verify icons
      # ==========================================
      - name: Verify Android icons
        run: |
          echo "========== Android launcher icons =========="

          find android/app/src/main/res \
            -type f \
            -name "ic_launcher*" \
            -print


      # ==========================================
      # 15. Configure Gradle memory
      # ==========================================
      - name: Configure Gradle
        run: |
          mkdir -p android

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          android.useAndroidX=true
          EOF


      # ==========================================
      # 16. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --max-workers=2


      # ==========================================
      # 17. Check APK
      # ==========================================
      - name: Check APK
        run: |
          echo "========== APK =========="

          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          ls -lh android/app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # 18. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
