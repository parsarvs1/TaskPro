name: Build TaskPro APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build TaskPro Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ==========================================
      # 3. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      # ==========================================
      # 4. Check versions
      # ==========================================
      - name: Check versions
        run: |
          echo "========== JAVA =========="
          java -version

          echo "========== NODE =========="
          node --version

          echo "========== NPM =========="
          npm --version


      # ==========================================
      # 5. Install npm dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          npm install \
            --no-audit \
            --no-fund \
            --prefer-offline \
            --fetch-retries=5 \
            --fetch-retry-factor=2 \
            --fetch-retry-mintimeout=10000 \
            --fetch-retry-maxtimeout=120000


      # ==========================================
      # 6. Build web app
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp manifest.json www/
          cp sw.js www/

          echo "========== WWW =========="
          ls -la www


      # ==========================================
      # 7. Check icon
      # ==========================================
      - name: Check application icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          file icon.png

          echo "Icon exists:"
          ls -lh icon.png


      # ==========================================
      # 8. Capacitor config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.parsa.taskpro",
            "appName": "TaskPro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          cat capacitor.config.json


      # ==========================================
      # 9. Clean old Android project
      # ==========================================
      - name: Prepare Android project
        run: |
          rm -rf android
          rm -rf resources

          mkdir -p resources

          cp icon.png resources/icon.png

          echo "Icon copied:"
          file resources/icon.png


      # ==========================================
      # 10. Add Android platform
      # ==========================================
      - name: Add Android platform
        run: |
          npx cap add android


      # ==========================================
      # 11. Generate Android icons
      # ==========================================
      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android


      # ==========================================
      # 12. Force Kotlin version
      # ==========================================
      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

          echo "Kotlin dependency fix added."


      # ==========================================
      # 13. Gradle properties
      # ==========================================
      - name: Configure Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


      # ==========================================
      # 14. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ==========================================
      # 15. Verify Android icons
      # ==========================================
      - name: Verify Android icons
        run: |
          echo "========== ICON FILES =========="

          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher*" -o -name "*launcher*" \) \
            | sort


      # ==========================================
      # 16. Gradle wrapper
      # ==========================================
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew


      # ==========================================
      # 17. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-parallel


      # ==========================================
      # 18. Find APK
      # ==========================================
      - name: Find APK
        run: |
          echo "========== APK FILES =========="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 19. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
