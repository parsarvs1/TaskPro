name: Build TaskPro APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TaskPro Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # Java 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # Check environment
      # ==========================================
      - name: Check environment
        run: |
          echo "========== JAVA =========="
          java -version

          echo ""
          echo "========== NODE =========="
          node --version

          echo ""
          echo "========== NPM =========="
          npm --version


      # ==========================================
      # Prepare package.json
      # ==========================================
      - name: Prepare package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi


      # ==========================================
      # Install Capacitor
      # ==========================================
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets \
            --save-dev \
            --no-audit \
            --no-fund


      # ==========================================
      # Prepare WWW
      # ==========================================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi


      # ==========================================
      # Check icon
      # ==========================================
      - name: Check icon
        run: |
          if [ ! -f icon.png ]; then
            echo "ERROR: icon.png not found!"
            exit 1
          fi

          echo "Icon found:"
          file icon.png


      # ==========================================
      # Capacitor config
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taskpro.app",
            "appName": "TaskPro",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # Add Android
      # ==========================================
      - name: Add Android
        run: |
          npx cap add android


      # ==========================================
      # Prepare icon
      # ==========================================
      - name: Prepare icon resources
        run: |
          rm -rf resources
          mkdir -p resources

          cp icon.png resources/icon.png

          echo "Resource icon:"
          file resources/icon.png


      # ==========================================
      # Generate Android icons
      # ==========================================
      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android


      # ==========================================
      # Fix Kotlin dependencies
      # ==========================================
      - name: Fix Kotlin dependencies
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("android/build.gradle")

          text = gradle_file.read_text()

          fix = r'''

          // ==========================================
          // TaskPro Kotlin dependency compatibility
          // ==========================================
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  }
              }
          }
          '''

          if "TaskPro Kotlin dependency compatibility" not in text:
              text += fix

          gradle_file.write_text(text)
          PY

          echo "Kotlin dependency fix applied."

          echo ""
          echo "========== android/build.gradle =========="
          cat android/build.gradle


      # ==========================================
      # Capacitor Sync
      # ==========================================
      - name: Capacitor Sync
        run: |
          npx cap sync android


      # ==========================================
      # Verify icons
      # ==========================================
      - name: Verify Android icons
        run: |
          echo "========== Launcher icons =========="

          find android/app/src/main/res \
            -type f \
            -name "ic_launcher*" \
            -print


      # ==========================================
      # Configure Gradle
      # ==========================================
      - name: Configure Gradle
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          android.useAndroidX=true
          EOF


      # ==========================================
      # Clean Gradle
      # ==========================================
      - name: Clean Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon


      # ==========================================
      # Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --max-workers=2


      # ==========================================
      # Check APK
      # ==========================================
      - name: Check APK
        run: |
          echo "========== APK =========="

          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          ls -lh android/app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
